<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Contact | VE:LASH</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@700;900&family=JetBrains+Mono:wght@400;700&display=swap">
<link rel="stylesheet" href="assets/css/style.css">
<link rel="stylesheet" href="assets/css/fx.css">
<link rel="stylesheet" href="assets/css/mobile.css">
<link rel="stylesheet" href="assets/css/desktop.css">
</head>
<body data-page="contact">

<main>
  <section class="page-hero">
    <p class="section-label">Get in touch</p>
    <h1 class="section-title glitch" data-text="Contact">Contact</h1>
    <p>ご注文・商品・取材・コラボレーションに関するお問い合わせはこちらから。</p>
  </section>

  <section class="section">
    <div class="bg-word right" data-speed="-0.2" aria-hidden="true">CONTACT</div>
    <div class="contact-grid">
      <div class="contact-info reveal">
        <dl>
          <div><dt>ONLINE STORE</dt><dd><a href="https://velash.base.shop/" target="_blank" rel="noopener" style="border-bottom:1px solid currentColor">velash.base.shop ↗</a></dd></div>
          <div><dt>EMAIL</dt><dd>info@example.com（仮）</dd></div>
          <div><dt>INSTAGRAM</dt><dd><a href="https://www.instagram.com/ve_lash_official/" target="_blank" rel="noopener" style="border-bottom:1px solid currentColor">@ve_lash_official ↗</a></dd></div>
          <div><dt>NOTE</dt><dd style="color:var(--muted);font-size:13px">ご注文・配送に関するお問い合わせは、注文番号を添えてご連絡ください。</dd></div>
        </dl>
      </div>
      <form class="form reveal" id="contact-form">
        <div class="field"><label for="f-type">TYPE / お問い合わせ種別</label>
          <select id="f-type" required>
            <option value="">選択してください</option>
            <option>ご注文・配送について</option>
            <option>商品について</option>
            <option>取材・コラボレーション</option>
            <option>その他</option>
          </select>
        </div>
        <div class="field"><label for="f-name">NAME / お名前</label><input id="f-name" required autocomplete="name"></div>
        <div class="field"><label for="f-mail">EMAIL / メールアドレス</label><input id="f-mail" type="email" required autocomplete="email"></div>
        <div class="field"><label for="f-msg">MESSAGE / 内容</label><textarea id="f-msg" required></textarea></div>
        <button class="submit-btn" type="submit">Send</button>
        <p class="form-msg" id="form-msg" role="status"></p>
      </form>
    </div>
  </section>
</main>

<script src="https://unpkg.com/lenis@1.1.13/dist/lenis.min.js"></script>
<script src="assets/js/main.js"></script>
<script src="assets/js/motion.js"></script>
<script src="assets/js/fx.js"></script>
</body>
</html>
