<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Shop | VE:LASH</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@700;900&family=JetBrains+Mono:wght@400;700&display=swap">
<link rel="stylesheet" href="assets/css/style.css">
<link rel="stylesheet" href="assets/css/fx.css">
<link rel="stylesheet" href="assets/css/mobile.css">
<link rel="stylesheet" href="assets/css/desktop.css">
<link rel="stylesheet" href="assets/css/fx2.css">
<script type="importmap">
{ "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.min.js", "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/" } }
</script>
</head>
<body data-page="shop">

<main>
  <section class="page-hero">
    <p class="section-label">Online Store</p>
    <h1 class="section-title">Shop</h1>
  </section>

  <section class="section">
    <div class="viewer">
      <div class="viewer-stage" id="viewer-stage" aria-label="商品の3Dビュー（ドラッグで回転）">
        <span class="viewer-label">3D VIEW — <span class="hint-mouse">DRAG</span><span class="hint-touch">SWIPE</span> TO ROTATE</span>
        <div class="floor"></div>
        <div class="garment">
          <div class="face"><img src="assets/img/sweat-black.webp" alt="Graffiti Logo Crew Sweat"></div>
          <div class="face back"><img src="assets/img/sweat-black.webp" alt=""></div>
        </div>
      </div>
      <div class="viewer-info">
        <div class="viewer-tabs" role="tablist" aria-label="3Dで見る商品">
          <button role="tab" data-model="hoodie" aria-selected="true">Hoodie</button>
          <button role="tab" data-model="heart-tee" aria-selected="false">Heart Tee</button>
          <button role="tab" data-model="classic-tee" aria-selected="false">Classic Tee</button>
          <button role="tab" data-model="sweat-black" aria-selected="false">Crew Sweat</button>
        </div>
        <h2 id="viewer-name">VE:LASH Full-Zip<br>Hoodie</h2>
        <p class="price" id="viewer-price">¥9,000</p>
        <p id="viewer-desc">胸に大きくVE:LASHロゴ、袖と背面にもロゴを配したフルジップパーカー。</p>
        <div id="viewer-colors" hidden>
          <p class="opt-label">Color</p>
          <div class="color-pick">
            <button data-id="sweat-black" aria-pressed="true" aria-label="Black" style="background:#111"></button>
            <button data-id="sweat-navy" aria-pressed="false" aria-label="Navy" style="background:#1b2340"></button>
            <button data-id="sweat-pink" aria-pressed="false" aria-label="Pink" style="background:#f2a6c8"></button>
          </div>
        </div>
        <p class="opt-label">Size</p>
        <div class="size-pick" id="viewer-sizes"></div>
        <a class="add-btn" id="viewer-buy" href="https://velash.base.shop/items/142651814" target="_blank" rel="noopener">Buy on BASE ↗</a>
        <p class="viewer-hint">ドラッグで回転 / 背面も見られます</p>
      </div>
    </div>
  </section>

  <section class="section" style="padding-top:0">
    <div class="section-head reveal">
      <div>
        <p class="section-label">All Items</p>
        <h2 class="section-title">Items</h2>
      </div>
    </div>
    <div class="product-grid" id="product-grid"></div>
  </section>
</main>

<script src="https://unpkg.com/lenis@1.1.13/dist/lenis.min.js"></script>
<script src="assets/js/main.js"></script>
<script src="assets/js/motion.js"></script>
<script src="assets/js/fx.js"></script>
<script src="assets/js/fx2.js"></script>
<script src="assets/js/fx3.js"></script>
<script src="assets/js/fx4.js"></script>
<script src="assets/js/fx5.js"></script>
<script src="assets/js/fx6.js"></script>
<script type="module" src="assets/js/garment3d.js"></script>
</body>
</html>
